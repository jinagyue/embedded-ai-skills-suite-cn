name: Smoke tests
on: [push, pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements-tools.txt
      - run: python -X utf8 tests/run_smoke_tests.py
      - run: python -X utf8 tests/test_single_entry_packaging.py
